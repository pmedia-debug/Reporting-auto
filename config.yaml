report:
  sheet_tab: "Sheet1"
  first_week_column: "L"
  date_header_row: 2
  timezone: "Asia/Kolkata"
  week_start: "monday"
  min_days_after_week_end: 3
  # Match the landing page URLs actually used by the GA4 property.
  ga4_landing_page_dimension: "landingPagePlusQueryString"
  signup_event_name: "sign_up"
  blog_path_prefix: "/blog/" # Aggregate all blog landing pages, not an approved URL list
  # GA4 counts signup events, not unique signing-up users.

properties:
  ga4_property_id: "352350939"
  gsc_site_url: "sc-domain:socialbee.com" # Or exact URL-prefix property, including trailing slash.
  site_base_url: "https://socialbee.com"

filters:
  branded_query_regex: "social bee|socialbee|socialvee|socialbe|conciergebee|social be |socialb |social media bee|sociabee"

