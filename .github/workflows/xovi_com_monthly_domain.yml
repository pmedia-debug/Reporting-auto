
name: XOVI.com Monthly Domain Report

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only - do not update Google Sheet"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: xovi-com-monthly-domain
  cancel-in-progress: false

jobs:
  monthly-report:
    name: Update XOVI.com Monthly Domain
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Step 3: Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r xovi_com/requirements.txt

      # Step 4: Validate Python files
      - name: Validate Python syntax
        run: |
          python -m py_compile xovi_com/main.py
          python -m py_compile xovi_com/monthly_domain.py

      # Step 5: Generate monthly reporting data
      - name: Generate XOVI.com Monthly Report
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          XOVI_COM_SHEET_ID: ${{ secrets.XOVI_COM_SHEET_ID }}
          PYTHONUNBUFFERED: "1"
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

        shell: bash
        run: |
          if [ "$PREVIEW" = "true" ]; then
            echo "Running XOVI.com monthly dry run"
            python xovi_com/monthly_domain.py --dry-run
          else
            echo "Running XOVI.com monthly live update"
            python xovi_com/monthly_domain.py
          fi
