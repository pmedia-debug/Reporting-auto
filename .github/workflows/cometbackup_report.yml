
name: Comet Backup SEO Report

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only - no Google Sheet changes"
        type: boolean
        required: true
        default: true

  # Enable after successful testing:
  # schedule:
  #   - cron: "30 4 * * *"

permissions:
  contents: read

concurrency:
  group: cometbackup-seo-report
  cancel-in-progress: false

jobs:
  update:
    name: Update Comet Backup Report
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r cometbackup/requirements.txt

      - name: Validate Python and configuration
        run: |
          python -m py_compile cometbackup/main.py
          python -c "import yaml; c=yaml.safe_load(open('cometbackup/config.yaml')); assert len(c['pages'])*5+11 == 116"

      - name: Generate Comet Backup report
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          COMETBACKUP_SHEET_ID: ${{ secrets.COMETBACKUP_SHEET_ID }}
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          PYTHONUNBUFFERED: "1"

        shell: bash
        run: |
          if [ "$PREVIEW" = "true" ]; then
            echo "Dry run - Comet Backup"
            python cometbackup/main.py --dry-run
          else
            echo "Live update - Comet Backup"
            python cometbackup/main.py
          fi
