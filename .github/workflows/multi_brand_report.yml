
name: Multi-Brand SEO Report (New)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only, do not update Sheets"
        type: boolean
        required: true
        default: true

  # Enable only after all projects are verified
  # schedule:
  #   - cron: "30 4 * * *"

permissions:
  contents: read

concurrency:
  group: multi-brand-seo-report
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        project:
          - xovi_com
          - xovi_de
          - solusvm
          - cometbackup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r multi_reporting/requirements.txt

      - name: Validate Python and configuration
        run: |
          python -m py_compile multi_reporting/engine.py
          python multi_reporting/validate_configs.py

      - name: Generate report
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          XOVI_COM_SHEET_ID: ${{ secrets.XOVI_COM_SHEET_ID }}
          XOVI_DE_SHEET_ID: ${{ secrets.XOVI_DE_SHEET_ID }}
          SOLUSVM_SHEET_ID: ${{ secrets.SOLUSVM_SHEET_ID }}
          COMETBACKUP_SHEET_ID: ${{ secrets.COMETBACKUP_SHEET_ID }}
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          if [ "$PREVIEW" = "true" ]; then
            python multi_reporting/engine.py --config "multi_reporting/configs/${{ matrix.project }}.yaml" --dry-run
          else
            python multi_reporting/engine.py --config "multi_reporting/configs/${{ matrix.project }}.yaml"
          fi
