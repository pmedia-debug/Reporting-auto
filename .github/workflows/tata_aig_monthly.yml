
name: Tata AIG Monthly SEO Report

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only - do not update Google Sheet"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: tata-aig-monthly-report
  cancel-in-progress: false

jobs:
  monthly-report:
    name: Update Tata AIG Monthly Report
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tata_aig/requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile tata_aig/metrics.py
          python -m py_compile tata_aig/monthly.py

      - name: Generate Tata AIG Monthly Report
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          TATA_AIG_SHEET_ID: ${{ secrets.TATA_AIG_SHEET_ID }}
          PYTHONUNBUFFERED: "1"
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        shell: bash
        run: |
          if [ "$PREVIEW" = "true" ]; then
            echo "Running Tata AIG monthly dry run"
            python tata_aig/monthly.py --dry-run
          else
            echo "Running Tata AIG monthly live update"
            python tata_aig/monthly.py
          fi
