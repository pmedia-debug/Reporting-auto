
name: SocialBee Weekly SEO Report

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socialbee-weekly-report
  cancel-in-progress: false

jobs:
  update-report:
    name: Test SocialBee Report
    runs-on: ubuntu-24.04

    timeout-minutes: 20

    steps:
      # Step 1: Checkout GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Step 3: Install required libraries
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Validate Python code
      - name: Validate Python syntax
        run: python -m py_compile main.py

      # Step 5: Test GA4, GSC and Google Sheets
      - name: Test weekly report - Dry Run
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py --dry-run
