
name: SocialBee Weekly SEO Report

on:
  
schedule:
  # Check every day at 10:00 AM IST
  - cron: "30 4 * * *"
  
  # Allow manual execution
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (do not update Google Sheet)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: socialbee-weekly-report
  cancel-in-progress: false

jobs:
  update-report:
    name: Update SocialBee Weekly Report
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile main.py

      - name: Update Google Sheets report
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          PYTHONUNBUFFERED: "1"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Running in preview mode"
            python main.py --dry-run
          else
            echo "Running live weekly report update"
            python main.py
          fi
