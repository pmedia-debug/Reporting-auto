
name: XOVI.com SEO Report

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only - no Google Sheet changes"
        type: boolean
        required: true
        default: true

  # Enable after successful testing:
  # schedule:
  #   - cron: "30 4 * * *"

permissions:
  contents: read

concurrency:
  group: xovi-com-seo-report
  cancel-in-progress: false

jobs:
  update:
    name: Update XOVI.com Report
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r xovi_com/requirements.txt

      - name: Validate Python and configuration
        run: |
          python -m py_compile xovi_com/main.py
          python -c "import yaml; c=yaml.safe_load(open('xovi_com/config.yaml')); assert len(c['pages'])*5+11 == 76"

      - name: Generate XOVI.com report
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          XOVI_COM_SHEET_ID: ${{ secrets.XOVI_COM_SHEET_ID }}
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          PYTHONUNBUFFERED: "1"

        shell: bash
        run: |
          if [ "$PREVIEW" = "true" ]; then
            echo "Dry run - XOVI.com"
            python xovi_com/main.py --dry-run
          else
            echo "Live update - XOVI.com"
            python xovi_com/main.py
          fi
